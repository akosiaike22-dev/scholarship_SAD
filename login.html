<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | ScholarTrack</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/supabase.js"></script><script defer src="js/auth.js"></script></head>
<body class="login-page"><main class="login-panel"><a class="brand" href="login.html">ScholarTrack</a><p class="eyebrow">SCHOLARSHIP OFFICE</p><h1>Sign in</h1><p class="muted">Use your authorized staff or administrator account.</p><form id="login-form"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button primary full" type="submit">Sign in</button><p id="login-message" class="message" role="alert"></p></form><details><summary>Need an account?</summary><form id="signup-form" class="signup-form"><p class="muted small">New accounts receive the Scholar role. An administrator must authorize staff access.</p><label>Full name<input name="full_name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="8" required></label><button class="button secondary full" type="submit">Create account</button></form></details></main></body></html>
