<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grade Submissions | ScholarTrack</title><link rel="stylesheet" href="css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="js/supabase.js"></script><script defer src="js/auth.js"></script><script defer src="js/grades.js"></script></head><body><header class="topbar"><a class="brand" href="index.html">ScholarTrack</a><nav><a href="index.html">Dashboard</a><a href="scholars.html">Scholars</a><a href="scholarships.html">Scholarship Programs</a><a class="current" href="grades.html">Grade Submissions</a><a href="compliance.html">Compliance</a><button class="link-button" data-logout>Logout</button></nav><span id="user-label" class="user-label"></span></header><main class="container"><div class="page-heading"><div><p class="eyebrow">SEMESTER RECORDS</p><h1>Grade submissions</h1></div></div><p id="page-message" class="message" role="status"></p><section class="section form-section"><h2>Submit semester grades</h2><form id="grade-form" class="form-grid"><label class="wide">Scholar<select name="scholar_id" required><option value="">Select a scholar</option></select></label><label>Academic year<input name="academic_year" placeholder="2025-2026" required></label><label>Semester<select name="semester" required><option value="">Select semester</option><option>1st Semester</option><option>2nd Semester</option><option>Summer</option></select></label><label>GWA (1.00–5.00)<input name="gwa" type="number" min="1" max="5" step="0.01" required></label><label>Units enrolled<input name="units_enrolled" type="number" min="0" step="1" required></label><label>Failed subjects<input name="failed_subjects" type="number" min="0" step="1" value="0" required></label><label>Incomplete subjects<input name="incomplete_subjects" type="number" min="0" step="1" value="0" required></label><div class="wide"><button class="button primary" type="submit">Submit for verification</button></div></form></section><section class="section"><div class="section-heading"><h2>Submissions</h2><label class="inline-filter">Show<select id="grade-status-filter"><option value="">All statuses</option><option>Pending</option><option>Verified</option><option>Returned</option></select></label></div><div class="table-wrap"><table><thead><tr><th>Scholar</th><th>Student ID</th><th>Academic period</th><th>GWA</th><th>Units</th><th>Submitted</th><th>Status</th><th>Result</th><th>Action</th></tr></thead><tbody id="grades-table"><tr><td colspan="9">Loading...</td></tr></tbody></table></div></section></main></body></html>
