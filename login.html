<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | ScholarTrack</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="js/supabase.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body class="login-page">
  <main class="login-panel" style="max-width: 400px;">
    <a class="brand" href="login.html">ScholarTrack</a>
    <p class="eyebrow">SCHOLARSHIP OFFICE</p>
    <h1>Sign in</h1>
    <p class="muted">Enter your account credentials to access the compliance portal.</p>

    <!-- Role Quick Selector -->
    <div style="display: flex; gap: 6px; margin: 14px 0 6px 0;">
      <button type="button" class="button secondary" style="flex: 1; padding: 5px 8px; font-size: 11px;" onclick="selectRole('staff')">Staff</button>
      <button type="button" class="button secondary" style="flex: 1; padding: 5px 8px; font-size: 11px;" onclick="selectRole('admin')">Admin</button>
      <button type="button" class="button secondary" style="flex: 1; padding: 5px 8px; font-size: 11px;" onclick="selectRole('scholar')">Scholar</button>
    </div>

    <form id="login-form">
      <label>Email
        <input name="email" id="loginEmail" type="email" autocomplete="username" value="staff@scholarship.edu" required>
      </label>
      <label>Password
        <input name="password" id="loginPassword" type="password" autocomplete="current-password" value="password123" required>
      </label>
      <button class="button primary full" type="submit" style="margin-top: 6px;">Sign in</button>
      <p id="login-message" class="message" role="alert"></p>
    </form>

    <details style="margin-top: 14px;">
      <summary>Need an account?</summary>
      <form id="signup-form" class="signup-form" style="margin-top: 10px;">
        <p class="muted small">New accounts receive the Scholar role. An administrator must authorize staff access.</p>
        <label>Full name<input name="full_name" required></label>
        <label>Email<input name="email" type="email" required></label>
        <label>Password<input name="password" type="password" minlength="8" required></label>
        <button class="button secondary full" type="submit">Create account</button>
      </form>
    </details>
  </main>

  <script>
    function selectRole(role) {
      const emailInput = document.getElementById('loginEmail');
      const passInput = document.getElementById('loginPassword');
      if (role === 'staff') {
        emailInput.value = 'staff@scholarship.edu';
      } else if (role === 'admin') {
        emailInput.value = 'admin@scholarship.edu';
      } else if (role === 'scholar') {
        emailInput.value = 'scholar@scholarship.edu';
      }
      passInput.value = 'password123';
    }
  </script>
</body>
</html>
